name: ubs_facil
description: "UBS Fácil — agendamento, fila em tempo real e lembretes para Unidades Básicas de Saúde."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  intl: any  # versão definida pelo flutter_localizations do seu Flutter
  # Para push real, descomente e siga o README (seção "Firebase"):
  # firebase_core: ^3.8.0
  # firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
